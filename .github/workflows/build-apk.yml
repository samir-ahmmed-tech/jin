name: Build JIN Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ ! -f app/release.jks ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
          fi

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Termux-Release-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
