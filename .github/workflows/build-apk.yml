name: Build JIN Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ ! -f app/release.jks ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
          fi

      - name: Fix AAPT PNG Format
        run: |
          python3 -m pip install pillow
          python3 -c "
          import glob
          from PIL import Image
          for p in glob.glob('app/src/main/res/**/*.png', recursive=True):
              try:
                  with Image.open(p) as img:
                      img.convert('RGBA').save(p, 'PNG')
                      print('Converted:', p)
              except Exception as e:
                  print('Error on', p, e)
          "

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Termux-Release-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.1
          name: "JIN v2.0.1 - AMOLED Dark & Agentic Super-Update"
          body: |
            ### JIN v2.0.1 Release
            - **AMOLED Dark Mode**: Full Pitch Black theme with high-contrast text.
            - **New App Icon**: Integrated throughout launcher, notifications, and branding.
            - **New Local & Remote Agents**: DeepSeek Harness, OpenAI Codex, OpenRouter universal support.
            - **30+ Agentic Skills**: Control YouTube, Instagram, Facebook, TikTok, Docker, AWS, APIs & more.
            - **Enhanced Voice Accuracy**: Switched to hardware-accelerated voice recognition filter.
            - **Developer Info**: Added developer profile for Samir Ahmmed.
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
