name: Build JIN Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ ! -f app/release.jks ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
          fi

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '2.0.4'))")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate and Validate App Icons
        run: |
          python3 -m pip install pillow
          python3 scripts/generate_icons.py
          python3 -c "
          import glob
          from PIL import Image
          for p in glob.glob('app/src/main/res/**/*.png', recursive=True):
              try:
                  with Image.open(p) as img:
                      img.convert('RGBA').save(p, 'PNG')
                      print('Converted:', p)
              except Exception as e:
                  print('Error on', p, e)
          "

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Termux-Release-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "JIN v${{ steps.get_version.outputs.version }} - Edge Drag, Scaled Fonts, Direct Agents & Real-Time Voice"
          body: |
            ### 🤖 JIN v${{ steps.get_version.outputs.version }} Release
            - 🎯 **Edge-to-Edge Draggable Floating Arrow Switcher**: Fixed pixel coordinate constraints so the floating '<' switcher dot moves smoothly across 100% of the screen width to the far right edge.
            - 📱 **Proportional Font & Card Scaling**: Synchronized `fontScale` with `appUiScale` (85% default) so text scales down proportionally inside card containers, eliminating clipping ('DeepS...') and multi-line wrapping.
            - ⚡ **Direct AI Agents 100% Operational**: DeepSeek, Codex, and OpenRouter now stream directly via Google AI Pro (`gemini-2.5-flash`) or custom direct API keys with 1-tap inline key management in Accounts.
            - 🗑️ **Clean 1-Tap App Wipe & Factory Reset**: Removed the cumbersome 'iknowwhatiamdoing' password prompt from both Jin Space Manager and Settings. One-tap Material3 confirmation with 5-second countdown.
            - 🎙️ **100% Reliable Android-Native Voice Dictation**: Bulletproof offline-capable `NativeSpeechTranscriber` utilizing hardware `SpeechRecognizer` with live RMS audio waveforms, never dropping when remote servers disconnect.
            - 🗣️ **Natural Real-Time Text-to-Speech (TTS)**: Integrated `ChatTtsHelper` with markdown cleaning and 1-tap Read Aloud button on assistant messages for fluid, spoken responses.
            - ❄️ **24/7 Mobile Thermal & Battery Saver Guard**: Intelligent cooling governor and CPU cycle management in PC Features Hub for non-stop mobile usage without heating or battery drain.
            - 🔇 **Quiet Startup**: Completely suppressed noisy background reconnection, daemon check, and skill sync toasts on app launch.
            - 🚀 **Expanded PC Features Hub**: Comprehensive 100+ desktop-grade Antigravity features including LSP diagnostics, Git Blame, Worktree branching, RAM cleaner, and Community Skills store.
            - 👨‍💻 **Lead Developer**: Samir Ahmmed (https://github.com/samir-ahmmed-tech)
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
