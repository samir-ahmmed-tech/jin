name: Build JIN Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ ! -f app/release.jks ]; then
            echo "Generating release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
          fi

      - name: Fix AAPT PNG Format
        run: |
          python3 -m pip install pillow
          python3 -c "
          import glob
          from PIL import Image
          for p in glob.glob('app/src/main/res/**/*.png', recursive=True):
              try:
                  with Image.open(p) as img:
                      img.convert('RGBA').save(p, 'PNG')
                      print('Converted:', p)
              except Exception as e:
                  print('Error on', p, e)
          "

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Termux-Release-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.3
          name: "JIN v2.0.3 - Swarm Concurrency, Supercharged Speed & PC IDE Features"
          body: |
            ### 🤖 JIN v2.0.3 Release
            - 🚀 **Swarm Multi-Agent Concurrency**: Run up to 6 concurrent agents simultaneously (AGY + DeepSeek + Claude + Codex + OpenRouter) without closing Antigravity.
            - ⚡ **Ready-Only Model Picker**: Chat box only displays active/ready configured models; unconfigured providers show instant '+ Add Key' unlock dialogs.
            - 🏎️ **Supercharged 200-300 MB/s Network Engine**: 2MB buffered streams, connection pooling, and optimized I/O pipeline.
            - 📱 **Global UI Scale Customization**: Granular interface zoom from 25% to 200% with quick presets for all screens.
            - 🔄 **Automatic Model Quota Failover**: Intelligent fallback switches to available models on HTTP 429 quota exhaustion so tasks never halt.
            - ⚙️ **Hardware Performance Tuning**: Safety-constrained CPU thread controls, memory cache sliders, and Turbo/Balanced/Power-Saver profiles.
            - 🧩 **Dynamic Community Skills & MCP Installer**: 1-click GitHub/npm/URL skill & plugin installer with 8 curated developer presets.
            - 🖥️ **Desktop/PC IDE Super-Features**: Quick Open File Palette (Ctrl+P fuzzy search), Scratchpad & Notes, and JIN IDE branding.
            - 🔇 **Quiet Startup**: Suppressed noisy background setup notifications and toasts for a clean, distraction-free experience.
            - 🎨 **Unified JIN Branding & 3D Robot Mascot**: Complete brand identity consistency across launcher icons, adaptive round icons, splash screen, and notifications.
            - 👨‍💻 **Lead Developer**: Samir Ahmmed (https://github.com/samir-ahmmed-tech)
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
