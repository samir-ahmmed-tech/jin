name: Build JIN Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ -f app/release-keystore.b64 ]; then
            echo "Restoring persistent release keystore from app/release-keystore.b64..."
            base64 -d app/release-keystore.b64 > app/release.jks
          elif [ -f app/release.jks ]; then
            echo "Existing release.jks found..."
          else
            echo "Generating persistent release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
            base64 -w 0 app/release.jks > app/release-keystore.b64
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/release-keystore.b64
            git commit -m "chore(ci): persist release keystore for reproducible APK signing [skip ci]" || true
            git push origin main || true
          fi

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '2.0.9'))")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate and Validate App Icons
        run: |
          python3 -m pip install pillow
          python3 scripts/generate_icons.py
          python3 -c "
          import glob
          from PIL import Image
          for p in glob.glob('app/src/main/res/**/*.png', recursive=True):
              try:
                  with Image.open(p) as img:
                      img.convert('RGBA').save(p, 'PNG')
                      print('Converted:', p)
              except Exception as e:
                  print('Error on', p, e)
          "

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Release-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "JIN v${{ steps.get_version.outputs.version }} - Edge-to-Edge Setup, Google Drive Vault, Gemini Notebooks & Persistent Updates"
          body: |
            ### 🚀 JIN v${{ steps.get_version.outputs.version }} Release
            - 🌟 **Full-Page Edge-to-Edge Agents Setup**: Recreated the active agents screen matching Jin's dark theme into a full edge-to-edge layout with zero text wrapping/clipping, responsive agent cards, and sticky bottom continue action.
            - ☁️ **Google Drive Cloud Vault with Direct Login**: Direct Google Account status & 1-tap sign-in inside the sync dialog, auto-refreshing OAuth tokens, backing up all direct chats, general chats, Gemini notebooks, custom folders, Termux projects workspace, and AI brain transcripts/artifacts.
            - 📓 **Gemini-Style Notebooks**: Comprehensive notebook creation, editing, and 1-tap contextual prompt attachments with live removable chips.
            - 🛠️ **Clickable Workspace Picker**: Restored clickable workspace selector during ongoing chats.
            - 🤖 **Dedicated Automation Controls**: Quick-launch sheet and prompt attachment options for Browser Automation MCP, Terminal Automation, and Agentic Flow Automation.
            - 🎛️ **Card Size & Font Size Customization**: New Card Size & Density Scale (50%–150%) and independent App Font Size Scale (50%–180%) sliders with preset quick chips in Settings.
            - 🔄 **Persistent APK Signing & Update Fix**: Fixed the issue where updating required deleting the app first. Established persistent release keystore signing across all builds and added explicit FileProvider permissions for PackageInstaller.
            - 📦 **Dual Flavor Release Builds**: Both `jin-termux` and `jin-standard` compiled in release mode.
            - 👨‍💻 **Lead Developer**: Samir Ahmmed (https://github.com/samir-ahmmed-tech)
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
