name: Build JIN Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ -f app/release-keystore.b64 ]; then
            echo "Restoring persistent release keystore from app/release-keystore.b64..."
            base64 -d app/release-keystore.b64 > app/release.jks
          elif [ -f app/release.jks ]; then
            echo "Existing release.jks found..."
          else
            echo "Generating persistent release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
            base64 -w 0 app/release.jks > app/release-keystore.b64
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/release-keystore.b64
            git commit -m "chore(ci): persist release keystore for reproducible APK signing [skip ci]" || true
            git push origin main || true
          fi

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '2.0.9'))")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate and Validate App Icons
        run: |
          python3 -m pip install pillow
          python3 scripts/generate_icons.py
          python3 -c "
          import glob
          from PIL import Image
          for p in glob.glob('app/src/main/res/**/*.png', recursive=True):
              try:
                  with Image.open(p) as img:
                      img.convert('RGBA').save(p, 'PNG')
                      print('Converted:', p)
              except Exception as e:
                  print('Error on', p, e)
          "

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Release-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "JIN v${{ steps.get_version.outputs.version }} - Enterprise Security, Privacy & Terms, Mobile Workspace Picker, 4MB High-Speed I/O & Unlimited PC Power Suite"
          body: |
            ### 🚀 JIN v${{ steps.get_version.outputs.version }} Release
            - 🔒 **Enterprise On-Device Security & AES-256-GCM Vault**: Hardware-salted on-device encryption for all sensitive API keys (OpenAI, DeepSeek, Claude, Gemini, OpenRouter, Custom proxy), SSH passwords, and session tokens. Frontend secret masking (`••••••••••••sk-****`), strict TLS/HTTPS transport enforcement, script/XSS sanitization, and zero secret leakage in logs.
            - 🛡️ **Sovereign Privacy Policy & Terms of Service**: Dedicated in-app dialogs guaranteeing 100% on-device data sovereignty, zero telemetry, zero analytics tracking, and local sandboxing.
            - 📁 **Fresh Mobile Folder Creation & Multi-Storage Workspace Picker**: '+ New Folder' modal to create brand new directories anywhere in Termux (`~/projects`) or Phone Storage (`/storage/emulated/0`), with 1-tap jump chips for Projects, Termux, Phone Storage, Documents, and Downloads.
            - ⚡ **4MB Ultra High-Speed Stream Buffer**: Boosted download engine to 4MB chunked stream buffers with rolling instantaneous throughput measurement, delivering high-speed 20-30+ MB/s downloads.
            - 🎛️ **Unlimited PC Power Features & Guidance Suite**: Comprehensive suite of 45+ PC tools with detailed instructions on what each tool does ('টুলের কাজ কি'), what happens when activated ('অন করলে কি হইবো'), and how to use it ('কীভাবে ব্যবহার করবেন').
            - 🔋 **Hardware, Thermal & Idle Governor**: CPU execution core scaling, RAM cache governor, low-battery/thermal throttle protection, and background idle execution limits to protect mobile hardware.
            - 🌐 **Full Autonomous AI Agent Browser Control**: In-app WebView sidebar with autonomous DOM inspection, clicking, typing, screenshots, and multi-tab control via local MCP server.
            - 📦 **Dual Flavor Release Builds**: Both `jin-termux` and `jin-standard` compiled in release mode with persistent signing.
            - 👨‍💻 **Lead Developer**: Samir Ahmmed (https://github.com/samir-ahmmed-tech)
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
