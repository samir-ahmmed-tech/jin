name: Build JIN Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Dual Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'jin_production_release_key' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'antigem' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'jin_production_release_key' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring persistent release keystore from GitHub Secret RELEASE_KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          elif [ -f app/release.jks ]; then
            echo "Existing release.jks found in workspace..."
          else
            echo "Generating release keystore for CI build..."
            keytool -genkey -v -keystore app/release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
          fi
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=release.jks" >> $GITHUB_ENV

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '2.2.4'))")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate and Validate App Icons
        run: |
          python3 -m pip install pillow
          python3 scripts/generate_icons.py
          python3 -c "
          import glob
          from PIL import Image
          for p in glob.glob('app/src/main/res/**/*.png', recursive=True):
              try:
                  with Image.open(p) as img:
                      img.convert('RGBA').save(p, 'PNG')
                      print('Converted:', p)
              except Exception as e:
                  print('Error on', p, e)
          "

      - name: Compile agy_ide_bridge for Android ARM64
        run: |
          mkdir -p app/src/main/assets/bin
          cd agy_ide_bridge
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o ../app/src/main/assets/bin/agy_ide_bridge main.go
          chmod +x ../app/src/main/assets/bin/agy_ide_bridge
          ls -lh ../app/src/main/assets/bin/agy_ide_bridge

      - name: Build Dual Release APKs (Full Suite + Pure Antigravity Edition)
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release
          ls -lh output/*.apk

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Release-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "JIN v${{ steps.get_version.outputs.version }} - Dual Edition Release (Full Suite APK + Pure Antigravity 2.0 PC Edition APK)"
          body: |
            ### 🚀 JIN v${{ steps.get_version.outputs.version }} Dual-Edition Production Release
            This release provides **TWO specialized production APKs** so you can choose the exact edition you prefer:

            #### 1️⃣ `jin-termux-v${{ steps.get_version.outputs.version }}-release.apk` — Full Multi-Agent & Mobile-Harness Suite Edition
            - **All 6 CLI Agents**: Google Antigravity (`agy`), Claude Code (`claude`), OpenCode CLI (`opencode`), DeepSeek CLI, OpenAI Codex CLI, and OpenRouter CLI.
            - **Zero-Key Free AI Gateway**: Works out-of-the-box with zero API keys required (`https://text.pollinations.ai/openai` fallback + OpenCode Zen Free Tier).
            - **Real-Time Conversational Voice Assistant (Fixed & Upgraded)**: Hybrid Android SpeechRecognizer + 16kHz PCM `AudioRecord` VAD + Cloud Whisper Fallback, async TTS pre-warm queue, Bangla (`bn-BD`) & English (`en-US`) script detection, and 2.2s Direct Voice AI Fallback.
            - **Harness Studio & Jin Fusion**: Autonomous multi-step file creation, editing, shell execution, and interactive diffs.

            #### 2️⃣ `jin-antigravity-only-v${{ steps.get_version.outputs.version }}-release.apk` — Pure Google Antigravity 2.0 PC-Grade Edition
            - **100% Dedicated to Google Antigravity (`AgentKind.AGY`)**: All third-party agents, external API screens, Harness Studio, and Fusion tabs are stripped out for maximum speed, accuracy, and low memory footprint.
            - **Full Antigravity PC (Antigravity 2.0 & IDE) Feature Set**:
              - ⚡ **Antigravity Turbo Optimizer**: 60fps UI frame coalescing (`16ms`), HTTP/2 + gRPC connection pre-warming, smart context pruning, and automatic rule & `@file` injection.
              - 🤖 **Subagents Manager**: Built-in `self`, `research`, and `image-generator` subagents plus custom `define_subagent` persistence and 1-tap parallel dispatch.
              - 🧩 **Rules, Skills & Hooks Studio**: Live editor for global and workspace `GEMINI.md` / `AGENTS.md` rules, `SKILL.md` skills creator, `hooks.json` lifecycle hooks, and 1-tap `migrate-workflows` converter.
              - ⏰ **Schedule & Cron Manager (`/schedule`)**: Create and manage one-shot timers and recurring 5-field cron jobs.
              - 🛡️ **PC Security & Execution Policy Sandbox**: Configure Tool Execution Policy (`auto`, `turbo`, `ask`), Terminal Sandbox (`workspace_only`, `full_termux`, `read_only`), and Artifact Review Mode.
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
