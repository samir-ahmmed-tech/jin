name: Build JIN Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JIN Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Keystore
        run: |
          if [ -f app/release-keystore.b64 ]; then
            echo "Restoring persistent release keystore from app/release-keystore.b64..."
            base64 -d app/release-keystore.b64 > app/release.jks
          elif [ -f app/release.jks ]; then
            echo "Existing release.jks found..."
          else
            echo "Generating persistent release keystore..."
            keytool -genkey -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=JIN, OU=JIN, O=JIN, L=City, S=State, C=US"
            base64 -w 0 app/release.jks > app/release-keystore.b64
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add app/release-keystore.b64
            git commit -m "chore(ci): persist release keystore for reproducible APK signing [skip ci]" || true
            git push origin main || true
          fi

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '2.0.9'))")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate and Validate App Icons
        run: |
          python3 -m pip install pillow
          python3 scripts/generate_icons.py
          python3 -c "
          import glob
          from PIL import Image
          for p in glob.glob('app/src/main/res/**/*.png', recursive=True):
              try:
                  with Image.open(p) as img:
                      img.convert('RGBA').save(p, 'PNG')
                      print('Converted:', p)
              except Exception as e:
                  print('Error on', p, e)
          "

      - name: Compile agy_ide_bridge for Android ARM64
        run: |
          mkdir -p app/src/main/assets/bin
          cd agy_ide_bridge
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o ../app/src/main/assets/bin/agy_ide_bridge main.go
          chmod +x ../app/src/main/assets/bin/agy_ide_bridge
          ls -lh ../app/src/main/assets/bin/agy_ide_bridge

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JIN-Release-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "JIN v${{ steps.get_version.outputs.version }} - DeepSeek Harness & Mobile-Harness Integration (4 Flavors: Online & Offline)"
          body: |
            ### 🚀 JIN v${{ steps.get_version.outputs.version }} Release
            - 📱 **4 Dedicated Production Flavors**:
              - `jin-standard-online-v${{ steps.get_version.outputs.version }}-release.apk`: Standard edition for general Android devices with live cloud AI and on-demand bundle downloading.
              - `jin-standard-offline-v${{ steps.get_version.outputs.version }}-release.apk`: Completely standalone standard edition running isolated local models and offline rootfs execution.
              - `jin-termux-online-v${{ steps.get_version.outputs.version }}-release.apk`: Termux-integrated power edition with terminal PTY, Termux:API, and online AI capabilities.
              - `jin-termux-offline-v${{ steps.get_version.outputs.version }}-release.apk`: Standalone Termux power edition configured for offline local model routing and native Linux tooling.
            - 🤖 **DeepSeek Harness (DSH) Engine**: Direct headless execution bridge with local reasoning streams (`dsh: reasoning:`), multi-provider routing, and autonomous file modification.
            - 📦 **Modular Runtime Bundle Manager**: Native Zstandard (`.tar.zst`) decompression engine managing isolated modular runtimes (Core Ubuntu 20.04 ARM64, DeepSeek Harness, Claude Code, Python 3, Android SDK 36/JDK 17, and Antigravity CLI).
            - 🔄 **Workspace Checkpoints & Diff Engine**: Real-time project baseline snapshots, line diff viewer (additions, deletions, context), and per-file Undo/Keep control.
            - 🛠️ **On-Device Android Project Builder**: In-app Android project scaffolding (Jetpack Compose & Kotlin/XML) with direct Gradle compilation and on-device APK installation via PackageInstaller session.
            - 🌐 **OpenRouter Routing Gateway & Local Format Adapter**: Built-in 127.0.0.1 proxy providing provider routing order with automatic fallbacks and Anthropic-to-OpenAI translation.
            - 🎛️ **100 Tools Desktop PC Power Suite**: Full suite of 100 desktop-grade tools across Antigravity 2.0, Cloud Code, OpenRouter, Terminal & SSH, Git DevOps, Display/Layout, and Android capabilities.
            - 🎙️ **Real-Time Conversational Voice Assistant (ChatGPT Style)**: Hands-free 2-way vocal conversation and task execution with animated pulsing Voice Orb, real-time speech transcription, silence detection, and natural vocal feedback via Text-to-Speech.
            - ☁️ **Advanced Google Drive Cloud Vault**: Full backup and 1-tap restore covering all SQLite conversation databases, summaries, encrypted credentials, user preferences, notebooks, and projects.
            - 👨‍💻 **Lead Developer**: Samir Ahmmed (https://github.com/samir-ahmmed-tech)
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
